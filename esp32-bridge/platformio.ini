[platformio]
default_envs = esp32-c3

[env]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D PSU_UART_RX_PIN=5
  -D PSU_UART_TX_PIN=4
  -D CORE_DEBUG_LEVEL=1

[env:esp32-c3]
build_flags =
  ${env.build_flags}
  -D BRIDGE_AUTH_REQUIRED=1

[env:esp32-c3-open]
build_flags =
  ${env.build_flags}
  -D BRIDGE_AUTH_REQUIRED=0
